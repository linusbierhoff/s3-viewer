<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bucketFill" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Handle arc -->
  <path d="M 368 308 Q 368 142 512 142 Q 656 142 656 308"
        fill="none" stroke="white" stroke-width="64" stroke-linecap="round"/>

  <!-- Bucket body -->
  <path d="M 268 308 L 318 760 Q 324 818 382 818 L 642 818 Q 700 818 706 760 L 756 308 Z"
        fill="url(#bucketFill)"/>

  <!-- Top rim ellipse (sits on top of body) -->
  <ellipse cx="512" cy="308" rx="244" ry="60" fill="white"/>

  <!-- File lines inside bucket -->
  <rect x="382" y="432" width="260" height="38" rx="19" fill="#2563EB" opacity="0.18"/>
  <rect x="382" y="510" width="210" height="38" rx="19" fill="#2563EB" opacity="0.14"/>
  <rect x="382" y="588" width="160" height="38" rx="19" fill="#2563EB" opacity="0.10"/>

  <!-- Subtle bottom rim for depth -->
  <ellipse cx="512" cy="760" rx="200" ry="46" fill="#BFDBFE" opacity="0.5"/>
</svg>
